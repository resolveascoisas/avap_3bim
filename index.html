<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Analítico AVAP - 3º Bimestre</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --primary: #0f172a; --secondary: #334155; --accent: #3b82f6; --bg: #f8fafc; --border: #e2e8f0;
            --red-vivid: #dc2626; --yellow-vivid: #facc15; --green-vivid: #16a34a;  
            --red-text: white; --yellow-text: black; --green-text: white;
            --blue-bg: #e0f2fe; --blue-text: #0369a1;
        }

        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; padding: 20px; color: var(--primary); }
        .dashboard-container { max-width: 1400px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05); min-height: 80vh; }
        
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border); padding-bottom: 15px; margin-bottom: 20px; gap: 20px;}
        .header-left { display: flex; align-items: center; gap: 15px; }
        .logo-img { height: 60px; width: auto; object-fit: contain; }
        .header-text h1 { margin: 0; font-size: 24px; color: var(--primary); }
        .header-text p { margin: 4px 0 0 0; font-size: 14px; color: var(--secondary); }

        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { padding: 10px 20px; cursor: pointer; border: 1px solid var(--border); background: #f1f5f9; border-radius: 6px; font-weight: 600; font-size: 14px; color: var(--secondary); transition: all 0.2s; text-decoration: none;}
        .tab-btn:hover { background: #e2e8f0; }
        .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        .btn-print { background-color: var(--secondary); color: white;}
        .btn-print:hover { background-color: var(--primary); }

        .controls { display: flex; gap: 20px; margin-bottom: 20px; align-items: flex-end; background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid var(--border); flex-wrap: wrap;}
        .controls select { padding: 8px 12px; border-radius: 6px; border: 1px solid #cbd5e1; font-family: 'Inter'; font-size: 14px; min-width: 220px; outline: none; cursor: pointer; }
        .controls label { font-weight: 600; font-size: 13px; display: block; margin-bottom: 5px; color: var(--secondary); }

        .table-wrapper { overflow-x: auto; margin-bottom: 30px; border-radius: 8px; border: 1px solid var(--border); }
        .data-table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; min-width: 1100px;}
        
        .data-table th, .data-table td { border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); padding: 8px 4px; text-align: center; vertical-align: middle; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        
        .data-table thead th { background: var(--primary); color: white; font-weight: 600; padding: 12px 4px; white-space: normal; cursor: pointer; user-select: none; transition: background 0.2s; }
        .data-table thead th:hover { background: #1e293b; }
        .sort-icon { display: inline-block; margin-left: 3px; font-size: 10px; color: #94a3b8; }
        .th-active { background: var(--accent) !important; }
        .th-active .sort-icon { color: white; }

        .col-clas { width: 60px; font-weight: 700; color: var(--secondary); background: #f1f5f9;}
        .col-text { text-align: left !important; font-weight: 600; background: #f8fafc; white-space: normal !important; width: 220px; }
        .col-total { font-weight: 700; border-left: 2px solid #94a3b8 !important; }
        .row-total td { border-top: 2px solid var(--primary); font-weight: 700; background: #f1f5f9; cursor: default; }

        .cell-red { background-color: var(--red-vivid) !important; color: var(--red-text) !important; font-weight: 700; }
        .cell-yellow { background-color: var(--yellow-vivid) !important; color: var(--yellow-text) !important; font-weight: 700; }
        .cell-green { background-color: var(--green-vivid) !important; color: var(--green-text) !important; font-weight: 700; }
        .cell-blue { background: var(--blue-bg) !important; color: var(--blue-text) !important; font-weight: 700; }
        .cell-empty { background: #f8fafc; color: #94a3b8; }

        .interactive-cell { cursor: pointer; transition: transform 0.1s; }
        .interactive-cell:hover { filter: brightness(0.9); transform: scale(0.98); }
        .rank-text { font-size: 10.5px; font-weight: 600; line-height: 1.2; }

        .chart-container { position: relative; height: 420px; width: 100%; margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border); }

        #loadingOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.96); z-index: 1000; display: flex; flex-direction: column;
            justify-content: center; align-items: center; font-size: 18px; font-weight: 600; color: var(--primary); text-align: center;
        }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid var(--accent); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        @media print {
            @page { size: landscape; margin: 10mm; }
            body { background: white; padding: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .no-print { display: none !important; }
            .dashboard-container { box-shadow: none; padding: 0; margin: 0; width: 100%; max-width: none; border: none;}
            .table-wrapper { border: none; overflow: visible; }
            .data-table { border: none; min-width: 0; width: 100%;}
            .data-table th, .data-table td { border: 1px solid #ccc; font-size: 10pt; padding: 4px 2px;}
            .data-table thead th { background: #e2e8f0 !important; color: black !important; }
            .col-clas { background: #f1f5f9 !important; color: black !important;}
            .row-total td { background: #f1f5f9 !important; border-top: 2px solid black !important;}
            .chart-container { page-break-inside: avoid; margin-top: 20px; height: 300px !important;}
        }
    </style>
</head>
<body>

<div id="loadingOverlay">
    <div class="spinner" id="loadingSpinner"></div>
    <div id="loadingText">Sincronizando Base de Dados (3º Bimestre)...</div>
    <div id="loadingSubtext" style="font-size: 13px; font-weight: 400; color: var(--secondary); margin-top: 10px; max-width: 600px;">Aguarde, processando arquivos da URE Avaré.</div>
</div>

<div class="dashboard-container">
    <div class="header">
        <div class="header-left">
            <img src="imagens/logo-ure-avare-site.png" alt="Logo URE Avaré" class="logo-img no-print" onerror="this.style.display='none'">
            <div class="header-text">
                <h1>Dashboard Avaliação Processual - 3º Bimestre</h1>
                <p>Análise Regional de Desempenho - <b>Dica: Clique sobre a % para alternar entre Percentual e Posição no Rank!</b></p>
            </div>
        </div>
        <button class="tab-btn btn-print no-print" onclick="window.print()">🖨️ Imprimir (Paisagem)</button>
    </div>

    <div class="tabs no-print">
        <button id="btnTabGeral" class="tab-btn active" onclick="setModo('GERAL')">📊 Visão Geral (Escolas)</button>
        <button id="btnTabEscola" class="tab-btn" onclick="setModo('ESCOLA')">🏫 Granulação por Turma</button>
    </div>

    <div class="controls no-print">
        <div id="escolaControls" style="display: none;">
            <label>Unidade Escolar:</label>
            <select id="escolaSelect" onchange="resetSortAndRender()"></select>
        </div>
        <div>
            <label>Etapa de Ensino:</label>
            <select id="etapaSelect" onchange="resetSortAndRender()">
                <option value="TODAS">Todas as Etapas</option>
                <option value="EFAF">EFAF (Ensino Fund. Anos Finais)</option>
                <option value="EM_TODOS">Ensino Médio (Todos)</option>
                <option value="EM_PROPEDEUTICO">EM Propedêutico</option>
                <option value="EM_TECNICO">EM Técnico</option>
            </select>
        </div>
        <div>
            <label>Turno:</label>
            <select id="turnoSelect" onchange="resetSortAndRender()">
                <option value="TODOS">Todos os Turnos</option>
                <option value="INTEGRAL">Integral</option>
                <option value="PARCIAL">Parcial</option>
            </select>
        </div>
    </div>

    <div class="table-wrapper" id="tabelaArea"></div>
    
    <div class="chart-container">
        <canvas id="mainChart"></canvas>
    </div>
</div>

<script>
    // Lista exata com os nomes dos arquivos na pasta dados/
    const ARQUIVOS_REDE = [
        "ABILIO RAPOSO FERRAZ JUNIOR - 903188.xlsx",
        "ASSENTAMENTO ZUMBI DOS PALMARES - 566032.xlsx",
        "AVELINO APARECIDO RIBEIRO DOUTOR - 14552.xlsx",
        "BENE ANDRADE DONA - 14631.xlsx",
        "CELSO FERREIRA DA SILVA PROFESSOR - 918489.xlsx",
        "COTA LEONEL DONA - 905185.xlsx",
        "DIMAS MOZART E SILVA PROFESSOR - 900424.xlsx",
        "EMILIO IMMOOS PADRE - 45226.xlsx",
        "ERUCE PAULUCCI PROFESSOR - 914484.xlsx",
        "GUIDO DIAS DE ALMEIDA PROFESSOR - 910119.xlsx",
        "JOAO CRUZ CORONEL - 14497.xlsx",
        "JOAO MICHELIN - 14485.xlsx",
        "JOAO TEIXEIRA DE ARAUJO PROFESSOR - 14588.xlsx",
        "JOSE APARECIDO CASTELUCCI PROFESSOR - 49888.xlsx",
        "JOSE LEITE PINHEIRO PROFESSOR - 14527.xlsx",
        "JOSE PENNA - 14540.xlsx",
        "JOSE PIRES DE CARVALHO DOUTOR - 924088.xlsx",
        "MARIA IZABEL CRUZ PIMENTEL DONA - 38908.xlsx",
        "MATILDE VIEIRA - 14679.xlsx",
        "PAULO ARAUJO NOVAES DOUTOR - 14461.xlsx",
        "PAULO DELICIO - 14515.xlsx",
        "PEDRO BENTO ALVES - 14503.xlsx",
        "PROFESSORA MARIANA APARECIDA TODESCATO - 191516.xlsx",
        "SANDRA APARECIDA DE ARAUJO PROFESSORA - 924337.xlsx"
    ];

    const DISCIPLINAS_PADRAO = [
        "Biologia", "Ciências", "Filosofia", "Sociologia", "Física",
        "Geografia", "História", "Língua Inglesa", "Língua Portuguesa",
        "Matemática", "Química"
    ];

    let dadosEscolasCache = {}; 
    let turmasGlobais = [];
    
    let modoAtual = 'GERAL';
    let chartInstance = null;
    let currentSortCol = 'media'; 
    let currentSortDir = 'desc';  
    let currentData = [];         
    let totaisGlobais = {}; 

    function extrairNomeEscola(nomeArquivo) {
        return nomeArquivo.replace(/\.xlsx$/i, '').replace(/\s*-\s*\d+$/, '').trim();
    }

    window.onload = async () => {
        if (window.location.protocol === 'file:') {
            document.getElementById('loadingSpinner').style.display = 'none';
            document.getElementById('loadingText').innerText = "Acesso Local Bloqueado pelo Navegador";
            document.getElementById('loadingSubtext').innerHTML = "<span style='color:#dc2626; font-weight:bold;'>Erro:</span> Arquivo aberto por duplo-clique.<br>Suba para o GitHub Pages ou abra com um servidor local (Live Server no VS Code).";
            return;
        }

        try {
            await carregarTodasPlanilhas();
            
            const escolasLidas = Object.keys(dadosEscolasCache);
            if (escolasLidas.length === 0) {
                throw new Error("Nenhuma planilha válida pôde ser carregada da pasta dados/.");
            }

            const select = document.getElementById('escolaSelect');
            select.innerHTML = "";
            escolasLidas.sort().forEach(nome => {
                select.innerHTML += `<option value="${nome}">${nome}</option>`;
            });

            document.getElementById('loadingOverlay').style.display = 'none';
            setModo('GERAL');
        } catch (e) {
            document.getElementById('loadingSpinner').style.display = 'none';
            document.getElementById('loadingText').innerText = "Erro ao consolidar as planilhas";
            document.getElementById('loadingSubtext').innerText = e.message || "Verifique se a pasta dados/ está no mesmo nível do index.html.";
            console.error(e);
        }
    };

    async function fetchAsArrayBuffer(url) {
        const resp = await fetch(encodeURI(url));
        if (!resp.ok) throw new Error(`404: ${url}`);
        return await resp.arrayBuffer();
    }

    function parseValorNumerico(val) {
        if (val === null || val === undefined || val === "" || val === "-") return -1;
        if (typeof val === 'number') {
            return val <= 1.0 && val > 0 ? val * 100 : val;
        }
        let str = String(val).replace('%', '').replace(',', '.').trim();
        let num = parseFloat(str);
        if (isNaN(num)) return -1;
        return num <= 1.0 && num > 0 ? num * 100 : num;
    }

    function classificarEtapa(turma) {
        let t = turma.toUpperCase();
        if (t.includes('ANO')) return 'EFAF';
        if (t.includes('SERIE') || t.includes('SÉRIE')) {
            if (t.match(/\d+\s*-\s*[A-ZÀ-Ú\s]+\s*-\s*\d+[ªºa-z]*\s*S[EÉ]RIE/i) || t.includes('MTEC') || t.includes('NOVOTEC') || t.includes('TÉCNICO') || t.includes('TECNICO') || t.includes('AGRO') || t.includes('ADMINISTRAÇÃO')) {
                return 'EM_TECNICO';
            }
            return 'EM_PROPEDEUTICO';
        }
        return 'OUTROS';
    }

    function extrairAnoSerie(nome) {
        const match = nome.match(/([1-9][º°ªa-z]*\s*(?:ANO|S[EÉ]RIE))/i);
        if (match) return match[1].toUpperCase().replace(/[^A-Z0-9]/g, '');
        return "OUTROS";
    }

    async function carregarTodasPlanilhas() {
        turmasGlobais = [];
        dadosEscolasCache = {};

        for (let i = 0; i < ARQUIVOS_REDE.length; i++) {
            const nomeArquivo = ARQUIVOS_REDE[i];
            const nomeEscola = extrairNomeEscola(nomeArquivo);
            document.getElementById('loadingSubtext').innerText = `Processando: ${nomeEscola} (${i + 1}/${ARQUIVOS_REDE.length})`;

            let buffer = null;
            const tentativas = [
                `dados/${nomeArquivo}`,
                `dados/${nomeEscola}.xlsx`
            ];

            for (let url of tentativas) {
                try {
                    buffer = await fetchAsArrayBuffer(url);
                    if (buffer) break;
                } catch(e) {}
            }

            if (!buffer) {
                console.warn(`Arquivo não encontrado para: ${nomeArquivo}`);
                continue;
            }

            try {
                const workbook = XLSX.read(new Uint8Array(buffer), { type: 'array' });
                
                // Prioridade: Aba 'Resultado automático' já compilada
                const abaResultadoNome = workbook.SheetNames.find(s => s.toLowerCase().includes('resultado'));
                
                if (abaResultadoNome) {
                    const sheet = workbook.Sheets[abaResultadoNome];
                    const rows = XLSX.utils.sheet_to_json(sheet, { defval: "" });
                    let turmasEscola = [];

                    rows.forEach(r => {
                        const keys = Object.keys(r);
                        if (keys.length === 0) return;
                        
                        let tNome = String(r[keys[0]]).trim();
                        if (!tNome || tNome.toUpperCase().includes("MÉDIA GLOBAL")) return;

                        let pres = parseInt(r["Alunos (Pres.)"] || r["Alunos que fizeram a avaliação"]) || 0;
                        let mat = parseInt(r["Total Matric."] || r["Total de Matrículas"]) || pres;
                        let part = parseValorNumerico(r["Part. (%)"] || r["Participação"]);
                        if (part === -1 && mat > 0) part = (pres / mat) * 100;

                        let disc = {};
                        DISCIPLINAS_PADRAO.forEach(d => {
                            let matchKey = keys.find(k => k.trim().toLowerCase() === d.toLowerCase());
                            disc[d] = matchKey ? parseValorNumerico(r[matchKey]) : -1;
                        });

                        let mg = parseValorNumerico(r["Média Geral"] || r["Media Geral"]);

                        let turmaObj = {
                            escola: nomeEscola,
                            turma: tNome,
                            nome: tNome,
                            anoSerie: extrairAnoSerie(tNome),
                            turno: tNome.toUpperCase().includes('INTEGRAL') ? 'INTEGRAL' : 'PARCIAL',
                            etapa: classificarEtapa(tNome),
                            pres: pres,
                            matrics: mat,
                            pctPart: part > -1 ? part : 100,
                            mediaGeral: mg,
                            disc: disc
                        };

                        turmasEscola.push(turmaObj);
                        turmasGlobais.push(turmaObj);
                    });

                    if (turmasEscola.length > 0) {
                        dadosEscolasCache[nomeEscola] = turmasEscola;
                    }
                }
            } catch (errParse) {
                console.warn(`Erro ao interpretar planilha de ${nomeEscola}:`, errParse);
            }
        }
    }

    function filtrarTurmas() {
        let fEtapa = document.getElementById('etapaSelect').value;
        let fTurno = document.getElementById('turnoSelect').value;

        return turmasGlobais.filter(t => {
            if (fTurno !== 'TODOS' && t.turno !== fTurno) return false;
            if (fEtapa === 'EFAF' && t.etapa !== 'EFAF') return false;
            if (fEtapa === 'EM_TODOS' && !t.etapa.startsWith('EM')) return false;
            if (fEtapa === 'EM_PROPEDEUTICO' && t.etapa !== 'EM_PROPEDEUTICO') return false;
            if (fEtapa === 'EM_TECNICO' && t.etapa !== 'EM_TECNICO') return false;
            return true;
        });
    }

    function processarDadosGeral() {
        currentData = [];
        let turmasFiltradas = filtrarTurmas();

        let globAlunos = 0, globMatriculas = 0;
        let globDiscSoma = {}, globDiscQtd = {};
        let mediaGeralSoma = 0, mediaGeralQtd = 0;

        DISCIPLINAS_PADRAO.forEach(d => {
            globDiscSoma[d] = 0;
            globDiscQtd[d] = 0;
        });

        Object.keys(dadosEscolasCache).forEach(escola => {
            let turmasEscola = turmasFiltradas.filter(t => t.escola === escola);
            if (turmasEscola.length === 0) return;

            let pres = 0, mat = 0;
            let discSoma = {}, discQtd = {};
            let mgSoma = 0, mgQtd = 0;

            DISCIPLINAS_PADRAO.forEach(d => {
                discSoma[d] = 0;
                discQtd[d] = 0;
            });

            turmasEscola.forEach(t => {
                pres += t.pres;
                mat += t.matrics;
                
                if (t.mediaGeral > -1) {
                    mgSoma += (t.mediaGeral * t.pres);
                    mgQtd += t.pres;
                }

                DISCIPLINAS_PADRAO.forEach(d => {
                    if (t.disc[d] > -1) {
                        discSoma[d] += (t.disc[d] * t.pres);
                        discQtd[d] += t.pres;
                    }
                });
            });

            let escDisc = {};
            DISCIPLINAS_PADRAO.forEach(d => {
                let pct = discQtd[d] > 0 ? (discSoma[d] / discQtd[d]) : -1;
                escDisc[d] = pct;
                if (pct > -1) {
                    globDiscSoma[d] += discSoma[d];
                    globDiscQtd[d] += discQtd[d];
                }
            });

            let pctPart = mat > 0 ? Math.min((pres / mat) * 100, 100) : 100;
            let mediaGeral = mgQtd > 0 ? (mgSoma / mgQtd) : -1;

            if (mediaGeral > -1) {
                mediaGeralSoma += mgSoma;
                mediaGeralQtd += mgQtd;
            }

            globAlunos += pres;
            globMatriculas += mat;

            currentData.push({
                nome: escola,
                pres: pres,
                matrics: mat,
                pctPart: pctPart,
                mediaGeral: mediaGeral,
                disc: escDisc
            });
        });

        let globDisc = {};
        DISCIPLINAS_PADRAO.forEach(d => {
            globDisc[d] = globDiscQtd[d] > 0 ? (globDiscSoma[d] / globDiscQtd[d]) : -1;
        });

        totaisGlobais = {
            globAlunos,
            globMatriculas,
            globPart: globMatriculas > 0 ? Math.min((globAlunos / globMatriculas) * 100, 100) : 0,
            globMedia: mediaGeralQtd > 0 ? (mediaGeralSoma / mediaGeralQtd) : -1,
            globDisc
        };

        renderizarTabelaEGratico();
    }

    function processarDadosEscola() {
        const nomeEscola = document.getElementById('escolaSelect').value;
        if (!nomeEscola) return;

        let turmasFiltradas = filtrarTurmas().filter(t => t.escola === nomeEscola);
        currentData = turmasFiltradas;

        let globAlunos = 0, globMatriculas = 0;
        let globDiscSoma = {}, globDiscQtd = {};
        let mediaGeralSoma = 0, mediaGeralQtd = 0;

        DISCIPLINAS_PADRAO.forEach(d => {
            globDiscSoma[d] = 0;
            globDiscQtd[d] = 0;
        });

        currentData.forEach(t => {
            globAlunos += t.pres;
            globMatriculas += t.matrics;
            
            if (t.mediaGeral > -1) {
                mediaGeralSoma += (t.mediaGeral * t.pres);
                mediaGeralQtd += t.pres;
            }

            DISCIPLINAS_PADRAO.forEach(d => {
                if (t.disc[d] > -1) {
                    globDiscSoma[d] += (t.disc[d] * t.pres);
                    globDiscQtd[d] += t.pres;
                }
            });
        });

        let globDisc = {};
        DISCIPLINAS_PADRAO.forEach(d => {
            globDisc[d] = globDiscQtd[d] > 0 ? (globDiscSoma[d] / globDiscQtd[d]) : -1;
        });

        totaisGlobais = {
            globAlunos,
            globMatriculas,
            globPart: globMatriculas > 0 ? Math.min((globAlunos / globMatriculas) * 100, 100) : 0,
            globMedia: mediaGeralQtd > 0 ? (mediaGeralSoma / mediaGeralQtd) : -1,
            globDisc
        };

        renderizarTabelaEGratico();
    }

    function sortArray() {
        currentData.sort((a, b) => {
            let valA, valB;
            if (currentSortCol === 'nome') { valA = a.nome; valB = b.nome; }
            else if (currentSortCol === 'pres') { valA = a.pres; valB = b.pres; }
            else if (currentSortCol === 'mat') { valA = a.matrics; valB = b.matrics; }
            else if (currentSortCol === 'part') { valA = a.pctPart; valB = b.pctPart; }
            else if (currentSortCol === 'media') { valA = a.mediaGeral; valB = b.mediaGeral; }
            else { valA = a.disc[currentSortCol]; valB = b.disc[currentSortCol]; }

            if (valA === valB) return a.nome.localeCompare(b.nome);
            if (typeof valA === 'string') return currentSortDir === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
            if (valA === -1 || isNaN(valA)) return 1; 
            if (valB === -1 || isNaN(valB)) return -1;
            return currentSortDir === 'asc' ? valA - valB : valB - valA;
        });
    }

    function getRank(listaMestre, itemNome, valorProcurado, tipoBusca, field, anoSerieFiltro = null) {
        if (valorProcurado === -1 || isNaN(valorProcurado)) return "-";
        let validos = [];

        listaMestre.forEach(item => {
            if (tipoBusca === 'turma' && anoSerieFiltro && item.anoSerie !== anoSerieFiltro) return;

            let v = -1;
            if (field === 'mediaGeral') v = item.mediaGeral;
            else if (field === 'pctPart') v = item.pctPart;
            else if (item.disc && item.disc[field] !== undefined) v = item.disc[field];

            if (v !== -1 && !isNaN(v)) {
                validos.push({ nome: item.nome, val: v });
            }
        });

        validos.sort((a, b) => b.val - a.val);

        let rank = 1;
        for (let i = 0; i < validos.length; i++) {
            if (i > 0 && validos[i].val < validos[i - 1].val) rank = i + 1;
            if (validos[i].nome === itemNome) return `${rank}/${validos.length}`;
        }
        return "-";
    }

    window.toggleCellText = function(cell) {
        const isPct = cell.getAttribute('data-showing-pct') === 'true';
        if (isPct) {
            cell.innerHTML = `<span class="rank-text">${cell.getAttribute('data-rank')}</span>`;
            cell.setAttribute('data-showing-pct', 'false');
        } else {
            cell.innerHTML = cell.getAttribute('data-pct');
            cell.setAttribute('data-showing-pct', 'true');
        }
    };

    function setModo(modo) {
        modoAtual = modo;
        document.getElementById('btnTabGeral').classList.toggle('active', modo === 'GERAL');
        document.getElementById('btnTabEscola').classList.toggle('active', modo === 'ESCOLA');
        document.getElementById('escolaControls').style.display = modo === 'ESCOLA' ? 'block' : 'none';
        resetSortAndRender();
    }

    function resetSortAndRender() {
        currentSortCol = 'media';
        currentSortDir = 'desc';
        if (modoAtual === 'GERAL') processarDadosGeral();
        else processarDadosEscola();
    }

    function handleSort(coluna) {
        if (currentSortCol === coluna) {
            currentSortDir = currentSortDir === 'asc' ? 'desc' : 'asc';
        } else {
            currentSortCol = coluna;
            currentSortDir = 'desc'; 
            if (coluna === 'nome') currentSortDir = 'asc'; 
        }
        renderizarTabelaEGratico();
    }

    function getSemaforoClass(pct) {
        if (pct < 0 || isNaN(pct)) return "cell-empty";
        if (pct < 30) return "cell-red";
        if (pct >= 50) return "cell-green";
        return "cell-yellow";
    }

    function getChartColor(pct) {
        if (pct < 0 || isNaN(pct)) return "#cbd5e1";
        if (pct < 30) return "#dc2626"; 
        if (pct >= 50) return "#16a34a"; 
        return "#facc15"; 
    }

    function renderHeaderCell(key, label, width = "auto") {
        const icone = currentSortCol === key ? (currentSortDir === 'asc' ? '▲' : '▼') : '↕';
        const activeClass = currentSortCol === key ? 'th-active' : '';
        return `<th style="width: ${width};" class="${activeClass}" onclick="handleSort('${key}')" title="Ordenar por ${label.replace(/<br>/g,' ')}">
                    ${label} <span class="sort-icon">${icone}</span>
                </th>`;
    }

    function generateCellHTML(pctStr, rankUre, rankUe, semaforoClass) {
        if (pctStr === "-") return `<td class="cell-empty">-</td>`;
        let rankStr = modoAtual === 'GERAL' ? `URE ${rankUre}` : `URE ${rankUre}<br>UE ${rankUe}`;
        return `<td class="${semaforoClass} interactive-cell" title="Clique para ver o Rank!" 
                    data-showing-pct="true" data-pct="${pctStr}" data-rank="${rankStr}" onclick="toggleCellText(this)">${pctStr}</td>`;
    }

    function renderizarTabelaEGratico() {
        sortArray();
        const totalRegistros = currentData.length;
        let htmlRows = "";
        let labels = [], dataPcts = [], bgColors = [];

        let clas = 0, pClas = 0;
        let turmasFiltradas = filtrarTurmas();

        currentData.forEach((e, index) => {
            clas = index + 1;
            if (index > 0 && currentSortCol !== 'nome') {
                let prevObj = currentData[index - 1];
                let cVal = currentSortCol === 'pres' ? e.pres :
                           currentSortCol === 'mat' ? e.matrics :
                           currentSortCol === 'part' ? e.pctPart :
                           currentSortCol === 'media' ? e.mediaGeral : e.disc[currentSortCol];
                let pVal = currentSortCol === 'pres' ? prevObj.pres :
                           currentSortCol === 'mat' ? prevObj.matrics :
                           currentSortCol === 'part' ? prevObj.pctPart :
                           currentSortCol === 'media' ? prevObj.mediaGeral : prevObj.disc[currentSortCol];
                if (cVal === pVal) clas = pClas; else pClas = clas;
            } else { pClas = clas; }

            let anoSerieFiltro = modoAtual === 'GERAL' ? null : e.anoSerie;
            let listaUre = modoAtual === 'GERAL' ? currentData : turmasFiltradas;
            let listaUe = modoAtual === 'GERAL' ? [] : currentData;

            let rUrePart = getRank(listaUre, e.nome, e.pctPart, modoAtual === 'GERAL' ? 'escola' : 'turma', 'pctPart', anoSerieFiltro);
            let rUePart = modoAtual === 'GERAL' ? "" : getRank(listaUe, e.nome, e.pctPart, 'turma', 'pctPart', anoSerieFiltro);
            let partPctStr = e.pctPart > -1 ? e.pctPart.toFixed(1).replace('.', ',') + "%" : "-";

            htmlRows += `<tr>
                <td class="col-clas">${currentSortCol === 'nome' ? clas : clas + 'º'}</td>
                <td class="col-text" title="${e.nome}">${e.nome}</td>
                <td>${e.pres}</td>
                <td>${e.matrics}</td>
                ${generateCellHTML(partPctStr, rUrePart, rUePart, "cell-blue")}`;

            DISCIPLINAS_PADRAO.forEach(d => {
                const pct = e.disc[d];
                let pctStr = (pct === -1 || isNaN(pct)) ? "-" : pct.toFixed(1).replace('.', ',') + "%";
                let rUre = getRank(listaUre, e.nome, pct, modoAtual === 'GERAL' ? 'escola' : 'turma', d, anoSerieFiltro);
                let rUe = modoAtual === 'GERAL' ? "" : getRank(listaUe, e.nome, pct, 'turma', d, anoSerieFiltro);
                htmlRows += generateCellHTML(pctStr, rUre, rUe, getSemaforoClass(pct));
            });

            let mgStr = (e.mediaGeral === -1 || isNaN(e.mediaGeral)) ? "-" : e.mediaGeral.toFixed(1).replace('.', ',') + "%";
            let rUreMg = getRank(listaUre, e.nome, e.mediaGeral, modoAtual === 'GERAL' ? 'escola' : 'turma', 'mediaGeral', anoSerieFiltro);
            let rUeMg = modoAtual === 'GERAL' ? "" : getRank(listaUe, e.nome, e.mediaGeral, 'turma', 'mediaGeral', anoSerieFiltro);
            htmlRows += generateCellHTML(mgStr, rUreMg, rUeMg, "col-total " + getSemaforoClass(e.mediaGeral));

            htmlRows += `</tr>`;

            let labelCurto = modoAtual === 'GERAL' ? e.nome.split(' ').slice(0, 2).join(' ') : e.nome.replace(/(INTEGRAL|MANHA|TARDE|NOITE|ANUAL|T1|T2|7H|9H|\-|\d{8,})/g, '').trim().substring(0, 15);
            labels.push(labelCurto);

            let chartVal = 0;
            if (currentSortCol === 'part') chartVal = e.pctPart > -1 ? e.pctPart.toFixed(1) : 0;
            else if (currentSortCol === 'media') chartVal = e.mediaGeral > -1 ? e.mediaGeral.toFixed(1) : 0;
            else chartVal = e.disc[currentSortCol] > -1 ? e.disc[currentSortCol].toFixed(1) : 0;
            dataPcts.push(chartVal);

            let colorVal = currentSortCol === 'part' ? (e.pctPart >= 95 ? 100 : (e.pctPart < 80 ? 0 : 40)) :
                           currentSortCol === 'media' ? e.mediaGeral : e.disc[currentSortCol];
            bgColors.push(getChartColor(colorVal));
        });

        const labelMain = modoAtual === 'GERAL' ? 'Escola' : 'Turma/Sala';
        let headerHtml = `<table class="data-table"><thead><tr>
            <th class="col-clas" title="Classificação">Clas.<br>/${totalRegistros}</th>
            ${renderHeaderCell('nome', labelMain, '200px')}
            ${renderHeaderCell('pres', 'Alunos<br>(Pres.)')}
            ${renderHeaderCell('mat', 'Total<br>Matric.')}
            ${renderHeaderCell('part', 'Part.<br>(%)')}
        `;
        DISCIPLINAS_PADRAO.forEach(d => headerHtml += renderHeaderCell(d, d));
        headerHtml += `${renderHeaderCell('media', 'Média<br>Geral')}</tr></thead><tbody>`;

        const tg = totaisGlobais;
        let totalRow = `<tr class="row-total">
            <td colspan="2" class="col-text">MÉDIA GLOBAL DOS FILTROS ATUAIS</td>
            <td>${tg.globAlunos || 0}</td>
            <td>${tg.globMatriculas || 0}</td>
            <td class="cell-blue">${tg.globPart ? tg.globPart.toFixed(1).replace('.', ',') + '%' : '0%'}</td>`;

        DISCIPLINAS_PADRAO.forEach(d => {
            const pct = tg.globDisc ? tg.globDisc[d] : -1;
            totalRow += `<td class="${getSemaforoClass(pct)}">${pct === -1 || isNaN(pct) ? "-" : pct.toFixed(1).replace('.', ',') + "%"}</td>`;
        });
        totalRow += `<td class="col-total ${getSemaforoClass(tg.globMedia)}">${tg.globMedia === -1 || isNaN(tg.globMedia) ? "-" : tg.globMedia.toFixed(1).replace('.', ',') + "%"}</td></tr>`;

        document.getElementById('tabelaArea').innerHTML = headerHtml + totalRow + htmlRows + `</tbody></table>`;

        let chartTitle = currentSortCol === 'part' ? "Taxa de Participação (%)" :
                         currentSortCol === 'media' ? "Média Geral (%)" : `Desempenho em ${currentSortCol} (%)`;
        if (modoAtual === 'ESCOLA') chartTitle += ` - ${document.getElementById('escolaSelect').value}`;

        desenharGrafico(labels, dataPcts, bgColors, chartTitle);
    }

    function desenharGrafico(labels, data, colors, title) {
        const ctx = document.getElementById('mainChart').getContext('2d');
        if (chartInstance) chartInstance.destroy();

        chartInstance = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [
                    { type: 'line', label: 'Meta Ideal (50%)', data: Array(labels.length).fill(50), borderColor: '#16a34a', borderWidth: 2, borderDash: [5, 5], fill: false, pointRadius: 0, order: 1 },
                    { type: 'line', label: 'Atenção Crítica (30%)', data: Array(labels.length).fill(30), borderColor: '#dc2626', borderWidth: 1.5, borderDash: [2, 2], fill: false, pointRadius: 0, order: 1 },
                    { type: 'bar', label: title, data: data, backgroundColor: colors, borderRadius: 4, order: 2 }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: { 
                    y: { beginAtZero: true, max: 100, title: { display: true, text: 'Porcentagem (%)' } },
                    x: { ticks: { font: { size: 10 } } }
                },
                plugins: { 
                    legend: { position: 'top', labels: { boxWidth: 12, font: { size: 11 } } }, 
                    tooltip: { callbacks: { label: function(c) { return c.raw + '%'; } } } 
                }
            }
        });
    }
</script>
